name: Release

# Release is manual-only. Publishing requires a complete signing configuration; there is no
# debug-key fallback.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag, e.g. v1.2.0 (must equal v + versionName)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Lint, test, assemble and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Require release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Release signing is required: $name is not configured."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Set RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD."
            exit 1
          fi

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          FILE=android/app/build.gradle.kts

          if ! [[ "$VERSION" =~ ^v[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Version must look like v1.2.0 (got: $VERSION)"
            exit 1
          fi

          VERSION_NAME=$(grep -m1 -E '^[[:space:]]*versionName = "' "$FILE" | sed -E 's/.*"(.*)".*/\1/')
          VERSION_CODE=$(grep -m1 -E '^[[:space:]]*versionCode = ' "$FILE" | sed -E 's/[^0-9]*([0-9]+).*/\1/')

          if [ "v$VERSION_NAME" != "$VERSION" ]; then
            echo "::error::Input $VERSION does not match versionName $VERSION_NAME in $FILE."
            exit 1
          fi

          PREVIOUS_TAG=$(git tag --list 'v*' --sort=-v:refname | sed -n '1p')
          if [ -n "$PREVIOUS_TAG" ]; then
            PREVIOUS_CODE=$(git show "$PREVIOUS_TAG:android/app/build.gradle.kts" \
              | grep -m1 -E '^[[:space:]]*versionCode = ' \
              | sed -E 's/[^0-9]*([0-9]+).*/\1/')
            if [ "$VERSION_CODE" -le "$PREVIOUS_CODE" ]; then
              echo "::error::versionCode $VERSION_CODE must be greater than $PREVIOUS_CODE from $PREVIOUS_TAG."
              exit 1
            fi
          fi

          echo "Releasing $VERSION with versionCode $VERSION_CODE."

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          test -s android/release.keystore

      - name: Lint, test and assemble release
        working-directory: android
        env:
          XINGCLASS_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          XINGCLASS_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          XINGCLASS_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          XINGCLASS_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew lint test assembleRelease --stacktrace

      - name: Verify release APK
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/XingClass-arm64-v8a-release.apk
          test -f "$APK" || { echo "Release APK missing"; exit 1; }

          AAPT2=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt2 -type f 2>/dev/null | sort -V | tail -1 || true)
          test -x "$AAPT2" || { echo "aapt2 not found under $ANDROID_HOME/build-tools"; exit 1; }
          "$AAPT2" dump badging "$APK" | sed -n '1,5p'

          echo "Native libraries:"
          unzip -l "$APK" | awk '$4 ~ /^lib\// { print "  " $4 }'

          BAD_ABI=$(unzip -l "$APK" | awk '$4 ~ /^lib\// && $4 !~ /^lib\/arm64-v8a\// { print $4 }')
          if [ -n "$BAD_ABI" ]; then
            echo "Unexpected ABI native libraries:"
            echo "$BAD_ABI"
            exit 1
          fi

          ( cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" ) > "$APK.sha256"
          cat "$APK.sha256"

      - name: Signing summary
        run: echo "### Signed with the release keystore" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.version }}
          name: XingClass ${{ inputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            android/app/build/outputs/apk/release/XingClass-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/XingClass-arm64-v8a-release.apk.sha256

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/release.keystore
