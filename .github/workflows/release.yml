name: Release

# Release is intentionally manual-only. A normal push or pull request can never create a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Lint, test, assemble and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like v1.0.0 (got: $VERSION)"
            exit 1
          fi

      - name: Decode release keystore
        if: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          test -s android/release.keystore

      - name: Lint, test and assemble release
        working-directory: android
        env:
          XINGCLASS_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          XINGCLASS_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          XINGCLASS_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          XINGCLASS_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew lint test assembleRelease --stacktrace

      - name: Verify release APK
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/XingClass-arm64-v8a-release.apk
          test -f "$APK" || { echo "Release APK missing"; exit 1; }

          # Must be a real Android package.
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -5

          # Only arm64-v8a is allowed. The app currently has no native libs at all.
          if unzip -l "$APK" | grep -q ' lib/'; then
            echo "Unexpected native libraries:"
            unzip -l "$APK" | grep ' lib/'
            exit 1
          fi

          sha256sum "$APK" > XingClass-arm64-v8a-release.apk.sha256
          cat XingClass-arm64-v8a-release.apk.sha256

      - name: Signing summary
        env:
          HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "### Signed with the release keystore" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No release keystore configured. The APK is debug-signed and must not be distributed publicly."
            echo "### ⚠️ Debug-signed release APK" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD before publishing." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: XingClass ${{ inputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            android/app/build/outputs/apk/release/XingClass-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/XingClass-arm64-v8a-release.apk.sha256

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/release.keystore
