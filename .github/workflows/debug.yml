name: Debug Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Lint, test and assemble debug
        run: ./gradlew lint test assembleDebug --stacktrace

      - name: Verify debug APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/XingClass-arm64-v8a-debug.apk
          test -f "$APK" || { echo "Debug APK missing"; exit 1; }

          echo "Native libraries:"
          unzip -l "$APK" | awk '$4 ~ /^lib\// { print "  " $4 }'

          BAD_ABI=$(unzip -l "$APK" | awk '$4 ~ /^lib\// && $4 !~ /^lib\/arm64-v8a\// { print $4 }')
          if [ -n "$BAD_ABI" ]; then
            echo "Unexpected ABI native libraries:"
            echo "$BAD_ABI"
            exit 1
          fi

          echo "Only arm64-v8a native libraries are packaged."
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: XingClass-debug-apk
          path: android/app/build/outputs/apk/debug/XingClass-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
